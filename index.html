<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a2e">
<title>Gym Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column under a forest-green header; cards on a pale sage ground. Serif for names and numbers, sans for small grey text. */
:root{
  --bg:#f4f6f1; --surface:#ffffff; --ink:#17241d; --muted:#4f5e54; --line:#d5ddcd;
  --accent:#1f3a2e; --accent-ink:#f4f6f1; --sage:#a3b18a; --sage-ink:#17241d; --soft:#e3e9dc; --tint:#eef2ea; --warn:#8a3b2a;
  --head:#1f3a2e; --head-ink:#eef2ea; --head-muted:#c9d4bf; --head-tab:#2b4a3b;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"Segoe UI","Open Sans",system-ui,-apple-system,Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101814; --surface:#18231d; --ink:#e8eee6; --muted:#a6b3a8; --line:#2c3b31;
    --accent:#a3b18a; --accent-ink:#13201a; --sage:#7f9168; --sage-ink:#0f1a13; --soft:#24352a; --tint:#1d2b22; --warn:#e3957f;
    --head:#0d1611; --head-ink:#e8eee6; --head-muted:#a6b3a8; --head-tab:#1f3a2e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101814; --surface:#18231d; --ink:#e8eee6; --muted:#a6b3a8; --line:#2c3b31;
  --accent:#a3b18a; --accent-ink:#13201a; --sage:#7f9168; --sage-ink:#0f1a13; --soft:#24352a; --tint:#1d2b22; --warn:#e3957f;
  --head:#0d1611; --head-ink:#e8eee6; --head-muted:#a6b3a8; --head-tab:#1f3a2e;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%;
  padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sage);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.005em}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:0;z-index:5;background:var(--head);color:var(--head-ink);padding:calc(14px + env(safe-area-inset-top)) 16px 12px}
.top-inner{max-width:640px;margin:0 auto;display:grid;gap:12px}
.top-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:26px;font-weight:600}
.top-sync{font-family:var(--sans);font-size:13px;color:var(--head-muted)}
nav.tabs{display:flex;gap:4px;background:var(--head-tab);border-radius:10px;padding:3px}
nav.tabs button{flex:1;border:0;background:none;padding:8px 0;border-radius:8px;color:var(--head-muted);font-size:15px}
nav.tabs button[aria-current="page"]{background:var(--sage);color:var(--sage-ink);font-weight:600}
.status{font-family:var(--sans);font-size:13px;color:var(--muted);padding:8px 0 0}
.status.err{color:var(--warn)}
section{display:grid;gap:12px;padding-top:16px}
.sec-h{display:flex;align-items:center;gap:8px;margin-top:8px}
.sec-h h2{font-size:20px;color:var(--accent)}
.sec-h .sub{font-family:var(--sans);color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.card > h2{font-size:23px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.muted,.small,.cue,.hist-note,label.f,.set-head,.sub,.empty,.chip{font-family:var(--sans)}
.muted{color:var(--muted)}
.small{font-size:14px}
.pill{display:inline-block;font-family:var(--sans);font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--accent);white-space:nowrap}
.pill.accent{background:var(--sage);color:var(--sage-ink)}
.pill.done{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;min-height:44px;color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--warn)}
.btn.full{width:100%}
.btn.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:16px}
.btn.link{background:none;border:0;padding:4px 0;min-height:0;text-decoration:underline;font-size:14px;justify-self:start}
.btn:disabled{opacity:.5;cursor:default}
.wo{display:flex;align-items:center;gap:12px}
.wo h3{font-size:18px}
.wo.next{border:2px solid var(--accent)}
.group-label{font-family:var(--display);font-size:15px;color:var(--muted);letter-spacing:.03em}
.ss{border-left:3px solid var(--sage);padding-left:10px;display:grid;gap:12px}
.ex h3{font-size:21px}
.target{font-variant-numeric:tabular-nums;font-weight:600}
.cue{font-size:14px;color:var(--muted)}
.histbox{background:var(--tint);border-radius:10px;padding:10px 12px;display:grid;gap:5px;font-size:14px}
.histbox .hrow{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.histbox .hdate{font-family:var(--sans);color:var(--muted);white-space:nowrap}
.histbox .hlist{border-top:1px solid var(--line);padding-top:6px;display:grid;gap:3px}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;align-items:center}
.set .n{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center}
.set input{width:100%;min-width:0;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-variant-numeric:tabular-nums;font-size:17px;text-align:center}
.set.is-done input{border-color:var(--accent);background:var(--soft)}
.tick{width:48px;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1;color:var(--muted)}
.set.is-done .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.set-head{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;font-size:12px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em}
textarea{width:100%;min-height:56px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);resize:vertical;font-family:var(--body)}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label.f input,label.f select,label.f textarea{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:16px;font-family:var(--body)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:400px){.grid4{grid-template-columns:1fr 1fr}}
.check{display:flex;align-items:center;gap:6px;font-size:14px;font-family:var(--sans)}
.hist-line{font-size:14px;font-variant-numeric:tabular-nums}
.hist-note{font-size:13px;color:var(--muted);font-style:italic}
.addbox{border:2px dashed var(--sage)}
.addlist{display:grid}
.addlist button{display:flex;justify-content:space-between;align-items:center;gap:8px;background:none;border:0;border-bottom:1px solid var(--soft);padding:10px 2px;min-height:44px;text-align:left;font-size:16px;color:var(--ink)}
.addlist button:last-child{border-bottom:0}
.addlist .meta{font-family:var(--sans);font-size:13px;color:var(--muted);white-space:nowrap}
.addlist .new{color:var(--accent);font-weight:600}
.modal{position:fixed;inset:0;background:rgba(10,20,14,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px}
.modal .card{max-width:480px;width:100%}
.empty{padding:24px;text-align:center;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--accent)} .chip.warn{color:var(--warn)}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="top-row"><div class="brand">Gym Log</div><span class="top-sync" id="top-sync"></span></div>
    <nav class="tabs" aria-label="Views">
      <button id="tab-today" data-action="tab" data-tab="today">Today</button>
      <button id="tab-plan" data-action="tab" data-tab="plan">Plan</button>
      <button id="tab-history" data-action="tab" data-tab="history">History</button>
      <button id="tab-sync" data-action="tab" data-tab="sync">Sync</button>
    </nav>
  </div>
</header>
<div class="wrap">
  <div id="status" class="status" role="status"></div>
  <main id="main"></main>
</div>
<div id="modal-root"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="app.js"></script>
</body>
</html>
